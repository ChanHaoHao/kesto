[project]
name = "kesto"
version = "0.1.0"
description = "Optimal solvers for Kesto, the daily 8x8 sliding-block puzzle"
readme = "README.md"
authors = [
    { name = "henry", email = "hychan@umich.edu" }
]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
