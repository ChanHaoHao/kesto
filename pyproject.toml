[project]
name = "kesto"
version = "0.1.0"
description = "Read a Kesto board off a screenshot and solve it optimally"
readme = "README.md"
authors = [
    { name = "henry", email = "hychan@umich.edu" }
]
requires-python = ">=3.12"
dependencies = [
    # kesto.search stores states as uint64 bitboard arrays; np.bitwise_count is 2.0+.
    "numpy>=2.0",
    # kesto.vision decodes board screenshots; Pillow normalises the PNG/JPEG
    # flavours a screen capture can arrive in.
    "pillow>=10.0",
]

[project.scripts]
kesto = "kesto.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
